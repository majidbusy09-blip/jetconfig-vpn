name: Build JetConfig VPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android Project and Native Files
        run: |
          # بکاپ‌گیری از کدهای اصلی و پکیج‌ها
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib_bak
          
          # ساخت ساختار نیتیو اندروید
          flutter create --project-name jetconfig_vpn --org com.jetconfig.vpn --platforms=android .
          
          # بازگرداندن کدها و تنظیمات اصلی
          mv pubspec.yaml.bak pubspec.yaml
          rm -rf lib
          mv lib_bak lib

          # تنظیم خودکار minSdkVersion روی ۲۱ (پشتیبانی از هر دو فرمت .kts و معمولی)
          python3 -c "
          import os
          files = ['android/app/build.gradle.kts', 'android/app/build.gradle']
          for p in files:
              if os.path.exists(p):
                  with open(p, 'r') as f: c = f.read()
                  c = c.replace('flutter.minSdkVersion', '21')
                  c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
                  c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
                  with open(p, 'w') as f: f.write(c)
          "

          # افزودن دسترسی‌ها و سرویس VPN به فایل AndroidManifest
          python3 -c "
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(p):
              with open(p, 'r') as f: c = f.read()
              perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
              '''
              service = '''
                  <service
                      android:name=\"com.flutterv2ray.flutter_v2ray.core.V2rayService\"
                      android:exported=\"false\"
                      android:permission=\"android.permission.BIND_VPN_SERVICE\">
                      <intent-filter>
                          <action android:name=\"android.net.VpnService\" />
                      </intent-filter>
                  </service>
              '''
              if 'android.permission.INTERNET' not in c:
                  c = c.replace('<application', perms + '\n    <application')
              if 'com.flutterv2ray.flutter_v2ray.core.V2rayService' not in c:
                  c = c.replace('</application>', service + '\n    </application>')
              with open(p, 'w') as f: f.write(c)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: JetConfig-VPN-Release
          path: build/app/outputs/flutter-apk/app-release.apk
