name: Build and Auto Release JetConfig VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn
          fi
          flutter pub get
          mkdir -p android/app

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/jetconfig-release.jks
          ls -la android/app/jetconfig-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << PROP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=jetconfig-release.jks
          PROP

      - name: Patch build.gradle for signing
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')

          loader = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''

          if 'keystoreProperties' not in g:
              # حتماً بعد از بلوک plugins {} قرار بگیرد
              m = re.search(r'plugins\s*\{[\s\S]*?\n\}', g)
              if m:
                  insert_at = m.end()
                  g = g[:insert_at] + '\n' + loader + '\n' + g[insert_at:]
              else:
                  g = loader + '\n' + g

          if 'signingConfigs' not in g:
              g = re.sub(
                  r'android\s*\{',
                  '''android {
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          ''',
                  g,
                  count=1,
              )

          g = g.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          if 'signingConfig signingConfigs.release' not in g:
              g = re.sub(
                  r'(release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  g,
                  count=1,
              )

          g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', g)
          g = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 21', g)

          gradle.write_text(g, encoding='utf-8')
          print('patched OK')
          PY

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare release artifact
        run: |
          mkdir -p release-files
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/JetConfig-VPN.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "JetConfig VPN (Latest Release)"
          body: |
            🚀 آخرین نسخه پایدار JetConfig VPN (امضای ثابت)
          files: release-files/JetConfig-VPN.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
