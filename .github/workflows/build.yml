name: Build JetConfig VPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android Project Structure
        run: |
          # پشتیبان‌گیری از کدهای شما
          cp pubspec.yaml pubspec.yaml.bak
          
          # ساخت ساختار نیتیو با نام معتبر
          flutter create --project-name jetconfig_vpn --org com.jetconfig.vpn --platforms=android .
          
          # بازگردانی تنظیمات پکیج‌ها
          mv pubspec.yaml.bak pubspec.yaml
          
          # تنظیم مشخصات اندروید
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true
          sed -i 's/minSdk .*/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          
          # اضافه کردن دسترسی‌ها و سرویس وی‌پی‌ان
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' $MANIFEST
          sed -i '/<\/application>/i \        <service android:name="com.flutterv2ray.flutter_v2ray.core.V2rayService" android:exported="false" android:permission="android.permission.BIND_VPN_SERVICE">\n            <intent-filter>\n                <action android:name="android.net.VpnService" />\n            </intent-filter>\n        </service>' $MANIFEST

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: JetConfig-VPN-Release
          path: build/app/outputs/flutter-apk/app-release.apk
