name: Build and Auto Release JetConfig VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn
          fi
          mkdir -p android/app

      - name: Set app name to JET VPN
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="JET VPN"/' "$MANIFEST"
            echo "label set to JET VPN"
          else
            echo "manifest not found"
            exit 1
          fi

      - name: Install icon tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Set app icon from logo
        run: |
          curl -fsSL -o /tmp/app_icon.png "https://majid6064.ir/logo.png"
          file /tmp/app_icon.png
          # اندازه‌های استاندارد لانچر
          declare -A SIZES=(
            [mipmap-mdpi]=48
            [mipmap-hdpi]=72
            [mipmap-xhdpi]=96
            [mipmap-xxhdpi]=144
            [mipmap-xxxhdpi]=192
          )
          RES="android/app/src/main/res"
          for folder in "${!SIZES[@]}"; do
            dir="$RES/$folder"
            mkdir -p "$dir"
            size="${SIZES[$folder]}"
            convert /tmp/app_icon.png -resize ${size}x${size} "$dir/ic_launcher.png"
            convert /tmp/app_icon.png -resize ${size}x${size} "$dir/ic_launcher_round.png"
            echo "wrote $dir (${size}px)"
          done
          # حذف adaptive icon که گاهی آیکون پیش‌فرض را برمی‌گرداند
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" || true
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" || true

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub add url_launcher
          flutter pub get

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/jetconfig-release.jks
          ls -la android/app/jetconfig-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << PROP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=jetconfig-release.jks
          PROP

      - name: Patch build.gradle for signing and minSdk
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle')
          g = path.read_text(encoding='utf-8')
          loader = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
          if 'keystoreProperties = new Properties()' not in g:
              m = re.search(r'plugins\\s*\\{[\\s\\S]*?\\n\\}', g)
              if m:
                  g = g[:m.end()] + '\\n' + loader + '\\n' + g[m.end():]
              else:
                  g = loader + '\\n' + g
          signing_block = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
          if 'signingConfigs {' not in g and 'signingConfigs{' not in g:
              g = re.sub(r'(android\\s*\\{)', r'\\1' + signing_block, g, count=1)
          g = g.replace('signingConfigs.debug', 'signingConfigs.release')
          g = re.sub(r'minSdkVersion\\s+[^\\n]+', 'minSdkVersion 21', g)
          g = re.sub(r'minSdk\\s*=\\s*[^\\n]+', 'minSdk = 21', g)
          path.write_text(g, encoding='utf-8')
          print('signing+minSdk OK')
          PY
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare release artifact
        run: |
          mkdir -p release-files
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/JetConfig-VPN.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "JET VPN (Latest Release)"
          body: |
            آخرین نسخه JET VPN
          files: release-files/JetConfig-VPN.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
