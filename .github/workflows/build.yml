name: Build JetConfig VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Configure Android Project, Modern SDKs & Persistent Keystore
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn
          flutter pub add url_launcher
          python3 -m pip install pillow

          # ساخت کلید امضای ثابت معتبر
          keytool -genkey -v -keystore jetconfig-key.jks -storepass jetconfig1234 -alias jetconfig -keypass jetconfig1234 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JetConfig, OU=Jet, O=JetConfig, L=Tehran, S=Tehran, C=IR"
          mv jetconfig-key.jks android/app/

          python3 -c "
          import urllib.request, os, shutil, re
          from PIL import Image

          # 1. تنظیم آیکون برنامه
          try:
              urllib.request.urlretrieve('https://majid6064.ir/logo.png', 'logo.png')
              im = Image.open('logo.png').convert('RGBA')
              w, h = im.size

              crop_size = int(min(w, h) * 0.76)
              cx, cy = w // 2, h // 2
              left = max(0, cx - crop_size // 2)
              top = max(0, cy - crop_size // 2)
              right = min(w, cx + crop_size // 2)
              bottom = min(h, cy + crop_size // 2)

              cropped = im.crop((left, top, right, bottom))

              anydpi = 'android/app/src/main/res/mipmap-anydpi-v26'
              if os.path.exists(anydpi):
                  shutil.rmtree(anydpi)

              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              for folder, size in sizes.items():
                  path = f'android/app/src/main/res/{folder}'
                  os.makedirs(path, exist_ok=True)
                  cropped.resize((size, size), Image.Resampling.LANCZOS).save(f'{path}/ic_launcher.png', 'PNG')
                  cropped.resize((size, size), Image.Resampling.LANCZOS).save(f'{path}/ic_launcher_round.png', 'PNG')
              print('Icons configured.')
          except Exception as e:
              print('Icon error:', e)

          # 2. تنظیم مانیفست اندروید
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  m = f.read()

              m = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"JetConfig VPN\"', m, count=1)

              perms = '''
                  <uses-permission android:name=\"android.permission.INTERNET\" />
                  <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
                  <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
                  <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
                  <uses-permission android:name=\"android.permission.CHANGE_NETWORK_STATE\" />
              '''
              m = m.replace('<application', perms + '\n    <application')

              queries = '''
                  <queries>
                      <intent>
                          <action android:name=\"android.intent.action.VIEW\" />
                          <data android:scheme=\"https\" />
                      </intent>
                      <intent>
                          <action android:name=\"android.intent.action.VIEW\" />
                          <data android:scheme=\"tg\" />
                      </intent>
                  </queries>
              '''
              m = m.replace('</manifest>', queries + '\n</manifest>')

              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(m)
              print('Manifest updated.')

          # 3. بازنویسی اصولی و بدون باگ build.gradle
          gradle_path = 'android/app/build.gradle'
          gradle_content = '''plugins {
              id \"com.android.application\"
              id \"kotlin-android\"
              id \"dev.flutter.flutter-gradle-plugin\"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }

          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.2.0'
          }

          android {
              namespace \"com.jetconfig.vpn\"
              compileSdk 34
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId \"com.jetconfig.vpn\"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }

              signingConfigs {
                  release {
                      keyAlias 'jetconfig'
                      keyPassword 'jetconfig1234'
                      storeFile file('jetconfig-key.jks')
                      storePassword 'jetconfig1234'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source '../..'
          }
          '''
          with open(gradle_path, 'w', encoding='utf-8') as f:
              f.write(gradle_content)
          print('Gradle cleanly configured with proper Android 14 parameters.')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Optimized Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload Arm64 APK (Main Modern Phones)
        uses: actions/upload-artifact@v4
        with:
          name: JetConfig-VPN-arm64-v8a (Lightweight)
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload All Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: JetConfig-VPN-All-Architectures
          path: build/app/outputs/flutter-apk/*.apk
