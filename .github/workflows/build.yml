name: Build and Auto Release JetConfig VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # برای flutter_v2ray_client + compileSdk 35
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35 + build-tools
        run: {
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35' || true
        }

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn
          fi
          mkdir -p android/app

      - name: Set app name to JET VPN
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="JET VPN"/' "$MANIFEST"
            grep -o 'android:label="[^"]*"' "$MANIFEST" | head -1
          else
            echo "WARNING: AndroidManifest.xml not found"
          fi

      - name: Install icon tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Set app icon from logo
        run: |
          curl -fsSL -o /tmp/app_icon.png "https://majid6064.ir/logo.png"
          file /tmp/app_icon.png
          RES="android/app/src/main/res"
          mkdir -p "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi"
          convert /tmp/app_icon.png -resize 48x48   "$RES/mipmap-mdpi/ic_launcher.png"
          convert /tmp/app_icon.png -resize 48x48   "$RES/mipmap-mdpi/ic_launcher_round.png"
          convert /tmp/app_icon.png -resize 72x72   "$RES/mipmap-hdpi/ic_launcher.png"
          convert /tmp/app_icon.png -resize 72x72   "$RES/mipmap-hdpi/ic_launcher_round.png"
          convert /tmp/app_icon.png -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert /tmp/app_icon.png -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher_round.png"
          convert /tmp/app_icon.png -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert /tmp/app_icon.png -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          convert /tmp/app_icon.png -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          convert /tmp/app_icon.png -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" || true
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" || true
          echo "icons written"

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub add url_launcher || true
          flutter pub get

      - name: Decode release keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/jetconfig-release.jks
          ls -la android/app/jetconfig-release.jks

      - name: Create key.properties
        run: |
          printf '%s\n' \
            "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" \
            "keyPassword=${{ secrets.KEY_PASSWORD }}" \
            "keyAlias=${{ secrets.KEY_ALIAS }}" \
            "storeFile=jetconfig-release.jks" \
            > android/key.properties
          wc -l android/key.properties

      - name: Patch build.gradle for signing, minSdk, compileSdk 35
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          if not path.exists():
              path = Path("android/app/build.gradle.kts")
          if not path.exists():
              raise SystemExit("android/app/build.gradle not found")

          g = path.read_text(encoding="utf-8")
          is_kts = path.suffix == ".kts"

          if is_kts:
              g = re.sub(r"minSdk\s*=\s*[^\n]+", "minSdk = 24", g)
              g = re.sub(r"compileSdk\s*=\s*[^\n]+", "compileSdk = 35", g)
              g = re.sub(r"targetSdk\s*=\s*[^\n]+", "targetSdk = 35", g)
              if "compileSdk" not in g:
                  g = re.sub(r"(android\s*\{)", r"\1\n    compileSdk = 35\n", g, count=1)
              path.write_text(g, encoding="utf-8")
              print("kts: compileSdk/targetSdk/minSdk patched")
              raise SystemExit(0)

          loader = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """

          if "keystoreProperties = new Properties()" not in g:
              m = re.search(r"plugins\s*\{[\s\S]*?\n\}", g)
              if m:
                  g = g[: m.end()] + "\n" + loader + "\n" + g[m.end() :]
              else:
                  g = loader + "\n" + g

          signing_block = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          """

          if "signingConfigs {" not in g and "signingConfigs{" not in g:
              g = re.sub(r"(android\s*\{)", r"\1" + signing_block, g, count=1)

          g = g.replace("signingConfigs.debug", "signingConfigs.release")

          # minSdk 24 (VPN / flutter_v2ray_client)
          g = re.sub(r"minSdkVersion\s+[^\n]+", "minSdkVersion 24", g)
          g = re.sub(r"minSdk\s*=\s*[^\n]+", "minSdk = 24", g)

          # compileSdk / targetSdk 35 — الزامی برای flutter_v2ray_client
          if re.search(r"compileSdkVersion\s+\d+", g):
              g = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 35", g)
          elif re.search(r"compileSdk\s+\d+", g):
              g = re.sub(r"compileSdk\s+\d+", "compileSdk 35", g)
          elif "compileSdk" not in g:
              g = re.sub(r"(android\s*\{)", r"\1\n    compileSdkVersion 35\n", g, count=1)

          if re.search(r"targetSdkVersion\s+\d+", g):
              g = re.sub(r"targetSdkVersion\s+\d+", "targetSdkVersion 35", g)
          elif re.search(r"targetSdk\s+\d+", g):
              g = re.sub(r"targetSdk\s+\d+", "targetSdk 35", g)

          if "signingConfig signingConfigs.release" not in g:
              g = re.sub(
                  r"(buildTypes\s*\{[\s\S]*?release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release\n",
                  g,
                  count=1,
              )

          path.write_text(g, encoding="utf-8")
          text = path.read_text(encoding="utf-8")
          assert "signingConfigs {" in text
          assert "35" in text
          print("signing + minSdk24 + compileSdk35 OK")
          print("--- app/build.gradle snippet ---")
          for line in text.splitlines():
              if any(k in line for k in ("compileSdk", "targetSdk", "minSdk", "signingConfig")):
                  print(line)
          PY

          # ریشه android/build.gradle اگر compileSdk سراسری داشت
          ROOT_G="android/build.gradle"
          if [ -f "$ROOT_G" ]; then
            sed -i 's/compileSdkVersion\s*[0-9]\+/compileSdkVersion 35/g' "$ROOT_G" || true
          fi

      - name: Build release APK
        run: |
          flutter doctor -v
          flutter build apk --release --split-per-abi

      - name: Prepare release artifact
        run: |
          mkdir -p release-files
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/JetConfig-VPN.apk
          else
            echo "APK not found"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi

      - name: Read app version
        id: ver
        run: |
          VER=""
          if [ -f lib/main.dart ]; then
            VER=$(grep -oP "appVersion\s*=\s*'\K[^']+" lib/main.dart | head -1 || true)
          fi
          if [ -z "$VER" ]; then
            VER="v0.0.0"
          fi
          case "$VER" in
            v*|V*) ;;
            *) VER="v$VER" ;;
          esac
          TAG="${VER}-b${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=JET VPN ${VER}" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body: |
            🚀 **JET VPN — بیلد خودکار**

            - نسخه داخل اپ: `${{ steps.ver.outputs.ver }}`
            - تگ: `${{ steps.ver.outputs.tag }}`
            - هسته: flutter_v2ray_client (Xray 26.9.9) — پشتیبانی VLESS Encryption
            - امضا با کلید ثابت
            - Actions run: `${{ github.run_number }}`

            APK: `JetConfig-VPN.apk` (arm64-v8a)
          files: release-files/JetConfig-VPN.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
