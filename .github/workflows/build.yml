name: Build JetConfig VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Set App Icon and Label
        run: |
          python3 -c "
          import urllib.request
          from PIL import Image
          import os, shutil

          # 1. Download Logo
          urllib.request.urlretrieve('https://majid6064.ir/logo.png', 'logo.png')
          im = Image.open('logo.png').convert('RGBA')

          # 2. Remove anydpi-v26 override
          anydpi_path = 'android/app/src/main/res/mipmap-anydpi-v26'
          if os.path.exists(anydpi_path):
              shutil.rmtree(anydpi_path)

          # 3. Generate PNG icons
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }
          for folder, size in sizes.items():
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              im.resize((size, size), Image.Resampling.LANCZOS).save(f'{path}/ic_launcher.png', 'PNG')

          # 4. Set App Title in AndroidManifest
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = content.replace('android:label=\"jetconfig_vpn\"', 'android:label=\"JetConfig VPN\"')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          print('Launcher icons and label configured successfully!')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetConfig-VPN-Release
          path: build/app/outputs/flutter-apk/app-release.apk
