name: Build and Auto Release JetConfig VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/jetconfig-release.jks
          ls -la android/app/jetconfig-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << PROP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=jetconfig-release.jks
          PROP

      - name: Ensure release signing in build.gradle
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          for name in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              p = Path(name)
              if not p.exists():
                  continue
              g = p.read_text(encoding='utf-8')

              if name.endswith('.kts'):
                  print(f'skip kts auto-patch for {name}')
                  continue

              if 'key.properties' not in g:
                  header = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''
                  g = header + g

              if 'signingConfigs' not in g:
                  g = re.sub(
                      r'(android\s*\{)',
                      r'''\1
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          ''',
                      g,
                      count=1,
                  )

              if 'signingConfig signingConfigs.release' not in g:
                  g = g.replace(
                      'signingConfig signingConfigs.debug',
                      'signingConfig signingConfigs.release',
                  )
                  if 'signingConfig signingConfigs.release' not in g:
                      g = re.sub(
                          r'(buildTypes\s*\{[\s\S]*?release\s*\{)',
                          r'\1\n            signingConfig signingConfigs.release\n',
                          g,
                          count=1,
                      )

              g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', g)
              g = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 21', g)

              p.write_text(g, encoding='utf-8')
              print(f'patched {name}')
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Optimized Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare release artifact
        run: |
          mkdir -p release-files
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/JetConfig-VPN.apk
          else
            echo "APK not found"; ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi

      - name: Auto Publish / Overwrite Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "JetConfig VPN (Latest Release)"
          body: |
            🚀 **آخرین نسخه پایدار اپلیکیشن JetConfig VPN**

            - امضا با کلید ثابت (قابل آپدیت روی نسخه قبلی)
            - بیلد خودکار GitHub Actions
          files: release-files/JetConfig-VPN.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
