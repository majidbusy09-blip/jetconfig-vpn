name: JET VPN - GitHub Agent Task Intake

on:
  issues:
    # Adding the agent-task label is the single admission event. An issue
    # created with that label also emits "labeled", so "opened" would enqueue twice.
    types: [labeled, edited]

permissions:
  contents: read
  issues: read

jobs:
  validate-and-package:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'agent-task')
    uses: ./.github/workflows/agent-task-intake-reusable.yml
    permissions:
      contents: read
      issues: read
