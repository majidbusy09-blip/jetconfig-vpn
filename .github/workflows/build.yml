name: Build and Auto Release JetConfig VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn
          fi
          flutter pub get
          mkdir -p android/app

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/jetconfig-release.jks
          ls -la android/app/jetconfig-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << PROP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=jetconfig-release.jks
          PROP

      - name: Patch build.gradle for signing
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          path = Path('android/app/build.gradle')
          g = path.read_text(encoding='utf-8')

          # 1) loader بعد از plugins
          loader = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
          if 'keystoreProperties' not in g:
              m = re.search(r'plugins\s*\{[\s\S]*?\n\}', g)
              if m:
                  g = g[:m.end()] + '\n' + loader + '\n' + g[m.end():]
              else:
                  g = loader + '\n' + g

          # 2) signingConfigs داخل اولین android {
          signing_block = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
          if 'signingConfigs' not in g:
              # فقط اولین android { سطح بالا
              g = re.sub(r'(\nandroid\s*\{)', r'\1' + signing_block, g, count=1)

          # 3) همه ارجاع‌های debug → release
          g = g.replace('signingConfigs.debug', 'signingConfigs.release')
          g = g.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          g = g.replace("signingConfigs.getByName('debug')", "signingConfigs.getByName('release')")

          # اگر release بدون signingConfig ماند
          if re.search(r'release\s*\{[^}]*signingConfig', g, re.S) is None:
              g = re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', g, count=1)

          g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', g)
          g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', g)

          path.write_text(g, encoding='utf-8')
          print('----- build.gradle head -----')
          print('\n'.join(path.read_text(encoding='utf-8').splitlines()[:80]))
          PY

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare release artifact
        run: |
          mkdir -p release-files
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/JetConfig-VPN.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "JetConfig VPN (Latest Release)"
          body: |
            🚀 آخرین نسخه پایدار JetConfig VPN (امضای ثابت)
          files: release-files/JetConfig-VPN.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
