name: Build and Auto Release JetConfig VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn
          fi
          mkdir -p android/app

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub add url_launcher
          flutter pub get

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/jetconfig-release.jks
          ls -la android/app/jetconfig-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << PROP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=jetconfig-release.jks
          PROP

      - name: Patch build.gradle for signing + minSdk 21
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
      - name: Set app name to JET VPN
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          if p.exists():
              t = p.read_text(encoding='utf-8')
              t2, n = re.subn(r'android:label="[^"]*"', 'android:label="JET VPN"', t, count=1)
              if n == 0:
                  t2 = t.replace('<application', '<application android:label="JET VPN"', 1)
              p.write_text(t2, encoding='utf-8')
              print('label set to JET VPN')
          else:
              print('manifest not found yet')
          PY
          path = Path('android/app/build.gradle')
          g = path.read_text(encoding='utf-8')

          loader = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
          if 'keystoreProperties = new Properties()' not in g:
              m = re.search(r'plugins\s*\{[\s\S]*?\n\}', g)
              if m:
                  g = g[:m.end()] + '\n' + loader + '\n' + g[m.end():]
              else:
                  g = loader + '\n' + g

          signing_block = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
          if 'signingConfigs {' not in g and 'signingConfigs{' not in g:
              g = re.sub(r'(android\s*\{)', r'\1' + signing_block, g, count=1)

          g = g.replace('signingConfigs.debug', 'signingConfigs.release')

          # اجبار minSdk به 21 (همه شکل‌های رایج)
          g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', g)
          g = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 21', g)
          g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', g)
          g = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 21', g)

          if 'minSdkVersion 21' not in g and 'minSdk = 21' not in g:
              g = re.sub(
                  r'(defaultConfig\s*\{)',
                  r'\1\n        minSdkVersion 21\n',
                  g,
                  count=1,
              )

          path.write_text(g, encoding='utf-8')
          text = path.read_text(encoding='utf-8')
          assert 'signingConfigs {' in text
          assert 'minSdkVersion 21' in text or 'minSdk = 21' in text
          print('signing + minSdk OK')
          print([line for line in text.splitlines() if 'minSdk' in line or 'signingConfig' in line])
          PY

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare release artifact
        run: |
          mkdir -p release-files
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/JetConfig-VPN.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "JetConfig VPN (Latest Release)"
          body: |
            🚀 آخرین نسخه پایدار JetConfig VPN (امضای ثابت)
          files: release-files/JetConfig-VPN.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
