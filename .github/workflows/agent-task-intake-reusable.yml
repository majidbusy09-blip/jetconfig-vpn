name: JET AI - Reusable Cross-Repository Task Intake

on:
  workflow_call:

permissions:
  contents: read
  issues: read

jobs:
  validate-and-package:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'agent-task')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the calling repository at the event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout trusted JET AI control-plane tooling
        uses: actions/checkout@v4
        with:
          repository: majidbusy09-blip/jetconfig-vpn
          ref: main
          path: .jet-ai/central
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Issue and build read-only intake artifact
        env:
          PYTHONPATH: ${{ github.workspace }}/.jet-ai/central
        run: |
          set -euo pipefail
          python -m tools.task_orchestrator.github_issue_intake \
            --event-file "$GITHUB_EVENT_PATH" \
            --output intake/task.json

      - name: Upload validated task artifact
        id: upload-task-artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-task-${{ github.event.issue.number }}
          path: intake/task.json
          if-no-files-found: error
          retention-days: 14

      - name: Dispatch artifact to the central inbox when its scoped credential is configured
        if: ${{ env.DISPATCH_TOKEN != '' }}
        env:
          DISPATCH_TOKEN: ${{ secrets.JET_AI_CENTRAL_DISPATCH_TOKEN }}
          ARTIFACT_ID: ${{ steps.upload-task-artifact.outputs.artifact-id }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.DISPATCH_TOKEN }}
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) {
              throw new Error("Upload action did not return a valid artifact ID.");
            }
            await github.rest.repos.createDispatchEvent({
              owner: "majidbusy09-blip",
              repo: "jetconfig-vpn",
              event_type: "jet-ai-task-artifact-ready",
              client_payload: {
                target_repository: context.payload.repository.full_name,
                target_repository_id: context.payload.repository.id,
                issue_number: context.payload.issue.number,
                workflow_run_id: context.runId,
                artifact_id: artifactId,
                artifact_name: `agent-task-${context.payload.issue.number}`,
                source_sha: context.sha
              }
            });

      - name: Report that central dispatch is awaiting credential setup
        if: ${{ env.DISPATCH_TOKEN == '' }}
        env:
          DISPATCH_TOKEN: ${{ secrets.JET_AI_CENTRAL_DISPATCH_TOKEN }}
        run: |
          echo "::warning::Task artifact was uploaded, but central ingestion was not dispatched."
          echo "::notice::Configure JET_AI_CENTRAL_DISPATCH_TOKEN in the target repository Actions secrets to enable central ingestion."
