name: Build JetConfig VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project & Full-Bleed App Icons
        run: |
          # ۱. ساخت مجدد پروژه اندروید با ساختار استاندارد
          flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn

          # ۲. برش هوشمند مرکز تصویر و ایجاد آیکون تمام‌صفحه (Full-Bleed)
          python3 -m pip install pillow
          python3 -c "
          import urllib.request, os, shutil, re
          from PIL import Image

          try:
              urllib.request.urlretrieve('https://majid6064.ir/logo.png', 'logo.png')
              im = Image.open('logo.png').convert('RGBA')
              w, h = im.size

              # برش دقیق کادر نئونی وسط لوگو برای پر کردن کامل قاب آیکون
              crop_size = int(min(w, h) * 0.76)
              cx, cy = w // 2, h // 2
              left = max(0, cx - crop_size // 2)
              top = max(0, cy - crop_size // 2)
              right = min(w, cx + crop_size // 2)
              bottom = min(h, cy + crop_size // 2)

              cropped = im.crop((left, top, right, bottom))

              # حذف تداخل پوشه anydpi
              anydpi = 'android/app/src/main/res/mipmap-anydpi-v26'
              if os.path.exists(anydpi):
                  shutil.rmtree(anydpi)

              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              for folder, size in sizes.items():
                  path = f'android/app/src/main/res/{folder}'
                  os.makedirs(path, exist_ok=True)
                  # ذخیره آیکون مربعی و دایره‌ای تمام‌کادر
                  cropped.resize((size, size), Image.Resampling.LANCZOS).save(f'{path}/ic_launcher.png', 'PNG')
                  cropped.resize((size, size), Image.Resampling.LANCZOS).save(f'{path}/ic_launcher_round.png', 'PNG')
              print('Full-bleed icons generated successfully.')
          except Exception as e:
              print('Icon error:', e)

          # ۳. تنظیم مجوزها و عنوان در مانیفست
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  m = f.read()

              m = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"JetConfig VPN\"', m, count=1)

              perms = '''
                  <uses-permission android:name=\"android.permission.INTERNET\" />
                  <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
                  <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
                  <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
                  <uses-permission android:name=\"android.permission.CHANGE_NETWORK_STATE\" />
              '''
              m = m.replace('<application', perms + '\n    <application')

              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(m)
              print('Manifest updated.')

          # ۴. تنظیم حداقل SDK
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r', encoding='utf-8') as f:
                  g = f.read()
              g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', g)
              g = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 21', g)
              with open(gradle_path, 'w', encoding='utf-8') as f:
                  f.write(g)
              print('Gradle configured.')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetConfig-VPN-Release
          path: build/app/outputs/flutter-apk/app-release.apk
