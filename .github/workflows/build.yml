name: Build and Auto Release JetConfig VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/jetconfig-release.jks
          ls -la android/app/jetconfig-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << PROP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=jetconfig-release.jks
          PROP

      - name: Ensure release signing in build.gradle
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          # app-level gradle (Groovy)
          for name in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              p = Path(name)
              if not p.exists():
                  continue
              g = p.read_text(encoding='utf-8')

              if name.endswith('.kts'):
                  # Kotlin DSL – minimal skip; most Flutter 3.19 templates use Groovy
                  print(f'skip kts auto-patch for {name}')
                  continue

              if 'key.properties' not in g:
                  header = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''
                  g = header + g

              if 'signingConfigs' not in g:
                  g = re.sub(
                      r'(android\s*\{)',
                      r'''\1
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          ''',
                      g,
                      count=1,
                  )

              if 'signingConfig signingConfigs.release' not in g:
                  g = g.replace(
                      'signingConfig signingConfigs.debug',
                      'signingConfig signingConfigs.release',
                  )
                  # common buildTypes release block without signingConfig
                  if 'signingConfig signingConfigs.release' not in g:
                      g = re.sub(
                          r'(buildTypes\s*\{[\s\S]*?release\s*\{)',
                          r'\1\n            signingConfig signingConfigs.release\n',
                          g,
                          count=1,
                      )

              # minSdk
              g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', g)
              g = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 21', g)

              p.write_text(g, encoding='utf-8')
              print(f'patched {name}')
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Optimized Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare release artifact
        run: |
          mkdir -p release-files
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/JetConfig-VPN.apk
          else
            echo "APK not found"; ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi

      # نسخه از lib/main.dart؛ تگ یکتا = نسخه + شماره بیلد
      # هر بیلد Release جدید با تاریخ امروز (دیگر overwrite روی tag: latest نیست)
      - name: Read app version
        id: ver
        run: |
          VER=""
          if [ -f lib/main.dart ]; then
            VER=$(grep -oP "appVersion\s*=\s*'\K[^']+" lib/main.dart | head -1 || true)
          fi
          if [ -z "$VER" ]; then
            VER="v0.0.0"
          fi
          case "$VER" in
            v*|V*) ;;
            *) VER="v$VER" ;;
          esac
          TAG="${VER}-b${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=JET VPN ${VER}" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Publish New Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body: |
            🚀 **JET VPN — بیلد خودکار**

            - نسخه داخل اپ: `${{ steps.ver.outputs.ver }}`
            - تگ Release: `${{ steps.ver.outputs.tag }}`
            - امضا با کلید ثابت (قابل نصب روی نسخه قبلی)
            - بیلد: GitHub Actions (run `${{ github.run_number }}`)

            فایل APK: `JetConfig-VPN.apk` (arm64-v8a)
          files: release-files/JetConfig-VPN.apk
          prerelease: false
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
