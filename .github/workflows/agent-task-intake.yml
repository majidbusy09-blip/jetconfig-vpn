name: JET VPN - GitHub Agent Task Intake

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: read
  issues: read

concurrency:
  group: agent-task-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    if: github.event.issue.pull_request == null && contains(github.event.issue.labels.*.name, 'agent-task')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Issue and build intake artifact
        run: |
          python -m tools.task_orchestrator.github_issue_intake \
            --event-file "$GITHUB_EVENT_PATH" \
            --output intake/task.json
      - name: Upload validated task artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-task-${{ github.event.issue.number }}
          path: intake/task.json
          if-no-files-found: error
          retention-days: 14
