name: Build and Auto Release JetConfig VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn
          fi
          flutter pub get
          mkdir -p android/app

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/jetconfig-release.jks
          ls -la android/app/jetconfig-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << PROP
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=jetconfig-release.jks
          PROP

      - name: Configure app label, permissions, signing
        run: |
          python3 << 'PY'
          import os, re, shutil
          from pathlib import Path

          # Manifest
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              m = manifest.read_text(encoding='utf-8')
              m = re.sub(r'android:label="[^"]*"', 'android:label="JetConfig VPN"', m, count=1)
              perms = '''
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
          '''
              if 'android.permission.INTERNET' not in m:
                  m = m.replace('<application', perms + '\n    <application')
              queries = '''
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="tg" />
                  </intent>
              </queries>
          '''
              if '<queries>' not in m:
                  m = m.replace('</manifest>', queries + '\n</manifest>')
              manifest.write_text(m, encoding='utf-8')

          # build.gradle signing
          gradle = Path('android/app/build.gradle')
          if gradle.exists():
              g = gradle.read_text(encoding='utf-8')
              if 'key.properties' not in g:
                  header = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''
                  g = header + g
              if 'signingConfigs' not in g:
                  g = re.sub(
                      r'(android\s*\{)',
                      r'''\1
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          ''',
                      g,
                      count=1,
                  )
              g = g.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              if 'signingConfig signingConfigs.release' not in g:
                  g = re.sub(
                      r'(buildTypes\s*\{[\s\S]*?release\s*\{)',
                      r'\1\n            signingConfig signingConfigs.release\n',
                      g,
                      count=1,
                  )
              g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', g)
              g = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 21', g)
              gradle.write_text(g, encoding='utf-8')
              print('gradle patched')
          PY

      - name: Build Optimized Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare release artifact
        run: |
          mkdir -p release-files
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/JetConfig-VPN.apk
          else
            echo "APK not found"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi

      - name: Auto Publish / Overwrite Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "JetConfig VPN (Latest Release)"
          body: |
            🚀 **آخرین نسخه پایدار اپلیکیشن JetConfig VPN**

            - امضا با کلید ثابت (قابل آپدیت)
            - بیلد خودکار GitHub Actions
          files: release-files/JetConfig-VPN.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
