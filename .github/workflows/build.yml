name: Build JetConfig VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Complete V2 Embedding Migration & Icon Setup
        run: |
          python3 -m pip install pillow
          python3 -c "
          import urllib.request, os, shutil, re
          from PIL import Image

          # ۱. دانلود و تولید آیکون‌های برنامه از لوگوی کانال
          try:
              urllib.request.urlretrieve('https://majid6064.ir/logo.png', 'logo.png')
              im = Image.open('logo.png').convert('RGBA')

              anydpi_path = 'android/app/src/main/res/mipmap-anydpi-v26'
              if os.path.exists(anydpi_path):
                  shutil.rmtree(anydpi_path)

              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              for folder, size in sizes.items():
                  path = f'android/app/src/main/res/{folder}'
                  os.makedirs(path, exist_ok=True)
                  im.resize((size, size), Image.Resampling.LANCZOS).save(f'{path}/ic_launcher.png', 'PNG')
              print('Icons configured successfully.')
          except Exception as e:
              print('Icon setup error:', e)

          # ۲. پاکسازی و اصلاح MainActivity به V2 Embedding
          for root, _, files in os.walk('android/app/src/main'):
              for file in files:
                  if file == 'MainActivity.kt':
                      f_path = os.path.join(root, file)
                      with open(f_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      pkg_match = re.search(r'package\s+[\w\.]+', content)
                      pkg = pkg_match.group(0) if pkg_match else 'package com.example.jetconfig_vpn'
                      new_code = f'{pkg}\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity() {{\n}}\n'
                      with open(f_path, 'w', encoding='utf-8') as f:
                          f.write(new_code)
                      print('MainActivity.kt cleanly migrated to V2.')

                  elif file == 'MainActivity.java':
                      f_path = os.path.join(root, file)
                      with open(f_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      pkg_match = re.search(r'package\s+[\w\.]+;', content)
                      pkg = pkg_match.group(0) if pkg_match else 'package com.example.jetconfig_vpn;'
                      new_code = f'{pkg}\n\nimport io.flutter.embedding.android.FlutterActivity;\n\npublic class MainActivity extends FlutterActivity {{\n}}\n'
                      with open(f_path, 'w', encoding='utf-8') as f:
                          f.write(new_code)
                      print('MainActivity.java cleanly migrated to V2.')

          # ۳. بازنویسی اصولی AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  m = f.read()

              # حذف رفرنس‌های نسخه V1
              m = m.replace('android:name=\"io.flutter.app.FlutterApplication\"', 'android:name=\"\${applicationName}\"')
              m = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"JetConfig VPN\"', m, count=1)
              m = re.sub(r'<meta-data[^>]*android:name=\"flutterEmbedding\"[^>]*/>', '', m)

              # افزودن تگ استاندارد V2
              v2_tag = '<meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />'
              m = m.replace('</application>', f'    {v2_tag}\n    </application>')

              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(m)
              print('AndroidManifest.xml fully updated.')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetConfig-VPN-Release
          path: build/app/outputs/flutter-apk/app-release.apk
