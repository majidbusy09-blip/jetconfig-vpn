name: JET VPN - Agent Lease Commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  lease-command:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'agent-task') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/jet-agent ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and execute the fixed lease command
        id: lease
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m tools.task_orchestrator.github_issue_lease_command
          --event-file "$GITHUB_EVENT_PATH"
          --output "$RUNNER_TEMP/lease-result.json"

      - name: Build lease-verified task handoff
        id: build_handoff
        if: >-
          success() &&
          (startsWith(github.event.comment.body, '/jet-agent claim ') ||
           startsWith(github.event.comment.body, '/jet-agent renew '))
        run: >-
          python -m tools.task_orchestrator.github_task_handoff
          --event-file "$GITHUB_EVENT_PATH"
          --lease-result "$RUNNER_TEMP/lease-result.json"
          --output "$RUNNER_TEMP/task-handoff.json"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload lease-verified handoff artifact
        id: upload_handoff
        if: >-
          success() &&
          (startsWith(github.event.comment.body, '/jet-agent claim ') ||
           startsWith(github.event.comment.body, '/jet-agent renew '))
        uses: actions/upload-artifact@v4
        with:
          name: jet-agent-handoff-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/task-handoff.json
          if-no-files-found: error
          retention-days: 14

      - name: Prepare local agent input envelope
        id: accept_handoff
        if: >-
          success() &&
          (startsWith(github.event.comment.body, '/jet-agent claim ') ||
           startsWith(github.event.comment.body, '/jet-agent renew '))
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m tools.task_orchestrator.github_task_handoff_accept
          --handoff-file "$RUNNER_TEMP/task-handoff.json"
          --create-branch
          --github-output "$GITHUB_OUTPUT"

      - name: Upload prepared local agent input
        id: upload_agent_input
        if: >-
          success() &&
          (startsWith(github.event.comment.body, '/jet-agent claim ') ||
           startsWith(github.event.comment.body, '/jet-agent renew '))
        uses: actions/upload-artifact@v4
        with:
          name: jet-agent-input-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ steps.accept_handoff.outputs.agent_input_path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Report the verified lease result on the Issue
        if: always() && steps.lease.outcome == 'success'
        uses: actions/github-script@v7
        env:
          RESULT_FILE: ${{ runner.temp }}/lease-result.json
          HANDOFF_BUILD_OUTCOME: ${{ steps.build_handoff.outcome }}
          HANDOFF_UPLOAD_OUTCOME: ${{ steps.upload_handoff.outcome }}
          ACCEPT_HANDOFF_OUTCOME: ${{ steps.accept_handoff.outcome }}
          AGENT_INPUT_UPLOAD_OUTCOME: ${{ steps.upload_agent_input.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, 'utf8'));
            const result = payload.result;
            const lines = [
              '**JET VPN lease ' + payload.operation + ': verified**',
              'Task: `' + payload.task_id + '`',
              'Owner: `' + result.owner + '`',
              'Claim ID: `' + result.claim_id + '`',
              'Status: `' + result.status + '`',
              'Lock branch: `' + result.lock_branch + '`',
              'Lock commit: `' + result.lock_commit + '`',
            ];
            if (result.base_sha) lines.push('Pinned base SHA: `' + result.base_sha + '`');
            if (result.expires_at) lines.push('Lease expires: `' + result.expires_at + '`');
            if (payload.operation === 'claim' || payload.operation === 'renew') {
              if (process.env.HANDOFF_BUILD_OUTCOME === 'success' &&
                  process.env.HANDOFF_UPLOAD_OUTCOME === 'success') {
                lines.push(
                  '',
                  '**Execution handoff artifact created.**',
                  'Download `jet-agent-handoff-' + payload.issue_number + '-' + context.runId +
                    '` from this run: https://github.com/' + context.repo.owner + '/' +
                    context.repo.repo + '/actions/runs/' + context.runId
                );
                if (process.env.ACCEPT_HANDOFF_OUTCOME === 'success' &&
                    process.env.AGENT_INPUT_UPLOAD_OUTCOME === 'success') {
                  lines.push(
                    '',
                    '**Local agent input envelope prepared.**',
                    'Download `jet-agent-input-' + payload.issue_number + '-' + context.runId +
                      '` from the same workflow run.'
                  );
                } else {
                  lines.push(
                    '',
                    '**WARNING:** The lease and handoff are valid, but local agent-input preparation or upload failed.',
                    'The handoff artifact is available; retry acceptance in a clean branch before dispatch.'
                  );
                }
              } else {
                lines.push(
                  '',
                  '**WARNING:** The lease is verified, but the handoff artifact was not created or uploaded.',
                  'Do not dispatch an agent from this run until the artifact issue is resolved.'
                );
              }
            } else {
              lines.push('', 'Lease release verified. No handoff artifact was created.');
            }
            lines.push(
              '',
              'This workflow does not wake a model or run implementation code. ' +
              'No source files are uploaded, and merge/release/deployment remain separate.'
            );
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: payload.issue_number,
              body: lines.join('\n'),
            });
