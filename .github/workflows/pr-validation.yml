name: JET VPN - PR Validation

on:
  push:
    branches:
      - ci/jet-vpn-pr-validation-20261122
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jet-vpn-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply repository-maintained V2Ray patches to CI cache
        run: bash tools/v2ray_notif_patch/apply_patch.sh

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --no-pub

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JET-VPN-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
