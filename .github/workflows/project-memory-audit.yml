name: JET VPN - Project Memory Audit

on:
  # Re-run the full regression + memory/index freshness audit after relevant
  # changes land on main. This is validation only; it never publishes a release.
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "docs/**"
      - "tools/project_memory/**"
      - ".github/workflows/project-memory-audit.yml"
  pull_request:
    branches:
      - main
      - docs/agent-memory-foundation-20261122
      - tools/dart-ast-memory-20261122
      - tools/dart-semantic-resolution-20261122
      - tools/dart-critical-paths-20261122
      - tests/recovery-regression-20261122
      - tests/live-verification-resume-20261122
      - tests/async-live-verifier-20261122
    # This workflow is a required branch-protection check. Run it for every
    # PR targeting main so unrelated path filters cannot leave the check pending.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-memory-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Verify generated code index and memory freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Resolve application package context for semantic analysis
        run: flutter pub get

      - name: Run application regression tests
        run: flutter test

      - name: Resolve isolated semantic-index tooling
        working-directory: tools/project_memory/semantic
        run: dart pub get --enforce-lockfile

      - name: Test Dart AST indexer
        working-directory: tools/project_memory/semantic
        run: dart test

      - name: Test resolved-element indexer
        working-directory: tools/project_memory/semantic
        run: dart test test/resolved_indexer_test.dart

      - name: Test critical-path report
        working-directory: tools/project_memory/semantic
        run: dart test test/critical_path_report_test.dart

      - name: Generate semantic AST index
        working-directory: tools/project_memory/semantic
        run: dart run bin/index.dart --write

      - name: Generate analyzer-resolved index
        working-directory: tools/project_memory/semantic
        run: dart run bin/resolve.dart --write

      - name: Generate critical-path reachability report
        working-directory: tools/project_memory/semantic
        run: dart run bin/critical_paths.dart --write

      - name: Verify deterministic semantic AST generation
        working-directory: tools/project_memory/semantic
        run: |
          cp ../../../docs/generated/jet_vpn_semantic_index.json "$RUNNER_TEMP/semantic-index-first.json"
          cp ../../../docs/generated/jet_vpn_resolved_index.json "$RUNNER_TEMP/resolved-index-first.json"
          cp ../../../docs/generated/jet_vpn_critical_paths.json "$RUNNER_TEMP/critical-paths-first.json"
          dart run bin/index.dart --write
          dart run bin/resolve.dart --write
          dart run bin/critical_paths.dart --write
          cmp "$RUNNER_TEMP/semantic-index-first.json" ../../../docs/generated/jet_vpn_semantic_index.json
          cmp "$RUNNER_TEMP/resolved-index-first.json" ../../../docs/generated/jet_vpn_resolved_index.json
          cmp "$RUNNER_TEMP/critical-paths-first.json" ../../../docs/generated/jet_vpn_critical_paths.json

      - name: Smoke-test task intelligence against the real generated source index
        if: ${{ hashFiles('tools/task_orchestrator/context_selector.py', 'tools/task_orchestrator/impact_analyzer.py') != '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          from tools.task_orchestrator.context_selector import select_context
          from tools.task_orchestrator.impact_analyzer import analyze_impact

          root = Path.cwd()
          revision = subprocess.run(
              ["git", "rev-parse", "HEAD"], cwd=root, check=True,
              text=True, capture_output=True,
          ).stdout.strip()
          resolved = root / "docs/generated/jet_vpn_resolved_index.json"
          critical = root / "docs/generated/jet_vpn_critical_paths.json"
          index = json.loads(resolved.read_text(encoding="utf-8"))
          files = index.get("source", {}).get("files", [])
          if not files:
              raise SystemExit("Real-data smoke test blocked: resolved index has no source files.")
          changed_path = files[0]["path"]
          task = {
              "task_id": "ci-real-semantic-smoke",
              "goal": "Verify VPN connection and routing context against the current source tree.",
              "capability_improved": "Accurate source selection and impact mapping.",
              "repository": {"base_sha": revision},
              "scope": {"allowed": ["lib/**"], "excluded": ["lib/generated/**"]},
          }
          selection = select_context(
              root=root, task_record=task, query="VPN connection routing",
              resolved_index_path=resolved, critical_paths_path=critical, limit=5,
          )
          impact = analyze_impact(
              root=root, task_record=task, changed_paths=[changed_path],
              resolved_index_path=resolved, critical_paths_path=critical,
          )
          if impact["indexed_changed_paths"] != [changed_path]:
              raise SystemExit("Impact analyzer did not verify the selected real source file.")
          if not isinstance(selection.get("suggestions"), list):
              raise SystemExit("Context selector returned an invalid suggestions collection.")
          print(f"Real-data semantic smoke passed at {revision[:12]}.")
          print(f"Verified source files: {len(files)}; context suggestions: {len(selection['suggestions'])}.")
          print(f"Impact analyzer verified: {changed_path}.")
          PY

      - name: Upload semantic AST index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jet-vpn-semantic-ast-index
          path: |
            docs/generated/jet_vpn_semantic_index.json
            docs/generated/jet_vpn_resolved_index.json
            docs/generated/jet_vpn_critical_paths.json
            docs/critical_paths.json
            tools/project_memory/semantic/pubspec.lock
          if-no-files-found: warn
          retention-days: 30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify lexical code index
        run: |
          set -euo pipefail
          python tools/project_memory/index_dart.py --check --check-status | tee project-memory-audit.txt
          cat project-memory-audit.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable code index
        uses: actions/upload-artifact@v4
        with:
          name: jet-vpn-code-index
          path: docs/generated/jet_vpn_code_index.json
          if-no-files-found: error
          retention-days: 30
