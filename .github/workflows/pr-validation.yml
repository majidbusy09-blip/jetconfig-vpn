name: JET VPN - Non-production PR Validation

on:
  push:
    branches:
      - integration/memory-and-recovery-20261122
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - "assets/**"
      - "fonts/**"
      - "gradle/**"
      - "tools/v2ray_notif_patch/**"
      - "tools/validation/**"
      - "tools/task_orchestrator/**"
      - "analysis_options.yaml"
      - "*.gradle"
      - "*.gradle.kts"
      - ".github/workflows/pr-validation.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jet-vpn-pr-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and arm64 APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "app_build=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR validation event: running full application validation."
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" |
            python3 tools/validation/classify_ci_scope.py

      - name: Set up Java
        if: steps.scope.outputs.app_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        if: steps.scope.outputs.app_build == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android scaffold in the temporary CI workspace
        if: steps.scope.outputs.app_build == 'true'
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          if [ -f test/widget_test.dart ] && grep -q "package:jetconfig_vpn/main.dart" test/widget_test.dart; then
            rm -f test/widget_test.dart
            rmdir test 2>/dev/null || true
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned sandbox cryptography dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r tools/task_orchestrator/requirements-sandbox-crypto-linux-x86_64-py312.lock

      - name: Inventory CI isolation prerequisites (read-only; not a sandbox test)
        run: python3 tools/task_orchestrator/runtime_probe.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Probe Bubblewrap isolation primitives (controlled benign self-test)
        run: python3 tools/task_orchestrator/runtime_acceptance_probe.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test task orchestrator safety gates and lifecycle
        run: python -m unittest discover -s tools/task_orchestrator/tests -p "test_*.py" -v

      - name: Test validation build preparation tool
        run: python3 -m unittest discover -s tools/validation -p "test_*.py"

      - name: Prepare isolated validation package and updater guard
        if: steps.scope.outputs.app_build == 'true'
        run: python3 tools/validation/prepare_validation_build.py

      - name: Align validation Android manifest and SDK with production
        if: steps.scope.outputs.app_build == 'true'
        run: python3 tools/validation/align_validation_android.py

      - name: Report generated Android package identity
        if: steps.scope.outputs.app_build == 'true'
        shell: bash
        run: |
          echo "Generated Android validation package configuration:"
          grep -nE '^[[:space:]]*(namespace|applicationId)[[:space:]]*=' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true
          grep -n 'android:label=' android/app/src/main/AndroidManifest.xml
          echo "This package is test-only and intentionally differs from production."

      - name: Install Flutter dependencies
        if: steps.scope.outputs.app_build == 'true'
        run: flutter pub get

      - name: Apply repository-maintained V2Ray patches to CI cache
        if: steps.scope.outputs.app_build == 'true'
        run: bash tools/v2ray_notif_patch/apply_patch.sh

      - name: Static analysis
        if: steps.scope.outputs.app_build == 'true'
        run: flutter analyze lib test --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run application tests
        if: steps.scope.outputs.app_build == 'true'
        run: flutter test --no-pub

      - name: Build debug APK smoke test
        if: steps.scope.outputs.app_build == 'true'
        run: flutter build apk --debug --no-pub --dart-define=JETVPN_VALIDATION_BUILD=true

      - name: Upload debug APK artifact
        if: steps.scope.outputs.app_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JET-VPN-TEST-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build arm64 release-mode comparison APK (split per ABI)
        if: steps.scope.outputs.app_build == 'true'
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-pub --dart-define=JETVPN_VALIDATION_BUILD=true --dart-define=APK_CHANNEL=arm64

      - name: Verify validation APK package, label, signer, and ABI
        if: steps.scope.outputs.app_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          BUILD_TOOLS="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools"
          AAPT="$(find "$BUILD_TOOLS" -name aapt -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$BUILD_TOOLS" -name apksigner -type f | sort -V | tail -1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -5
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.jetconfig.vpn.jetconfig_vpn.validation'"
          printf '%s\n' "$BADGING" | grep -Fq "application-label:'JET VPN TEST'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              abis = {name.split('/')[1] for name in apk.namelist()
                      if name.startswith('lib/') and len(name.split('/')) > 2}
          print("Native ABIs:", sorted(abis))
          if abis != {"arm64-v8a"}:
              raise SystemExit(f"Unexpected native ABI set: {sorted(abis)}")
          PY

      - name: Upload arm64 validation APK
        if: steps.scope.outputs.app_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JET-VPN-TEST-arm64-validation-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
