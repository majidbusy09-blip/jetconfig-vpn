name: JET VPN - GitHub Agent Task Intake

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: read
  issues: read

jobs:
  validate-and-package:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'agent-task')
    uses: ./.github/workflows/agent-task-intake-reusable.yml
    permissions:
      contents: read
      issues: read
