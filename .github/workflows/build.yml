name: Build and Auto Release JetConfig VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Android platform 35 + build-tools
        run: |
          set +e
          SM=""
          for c in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          do
            if [ -n "$c" ] && [ -x "$c" ]; then SM="$c"; break; fi
          done
          if [ -z "$SM" ]; then
            SM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Using sdkmanager: $SM"
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "ERROR: sdkmanager not found"
            ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || true
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          yes | "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          "$SM" --list_installed 2>/dev/null | grep -E 'android-35|build-tools;35' || true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn
          fi
          mkdir -p android/app

      - name: Set app name to JET VPN
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="JET VPN"/' "$MANIFEST"
            grep -o 'android:label="[^"]*"' "$MANIFEST" | head -1
          else
            echo "WARNING: AndroidManifest.xml not found"
          fi

      - name: Install icon tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Set app icon from logo
        run: |
          curl -fsSL -o /tmp/app_icon.png "https://majid6064.ir/logo.png"
          file /tmp/app_icon.png
          RES="android/app/src/main/res"
          mkdir -p "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi"
          convert /tmp/app_icon.png -resize 48x48   "$RES/mipmap-mdpi/ic_launcher.png"
          convert /tmp/app_icon.png -resize 48x48   "$RES/mipmap-mdpi/ic_launcher_round.png"
          convert /tmp/app_icon.png -resize 72x72   "$RES/mipmap-hdpi/ic_launcher.png"
          convert /tmp/app_icon.png -resize 72x72   "$RES/mipmap-hdpi/ic_launcher_round.png"
          convert /tmp/app_icon.png -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert /tmp/app_icon.png -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher_round.png"
          convert /tmp/app_icon.png -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert /tmp/app_icon.png -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          convert /tmp/app_icon.png -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          convert /tmp/app_icon.png -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" || true
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" || true
          echo "icons written"

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub add url_launcher || true
          flutter pub get

      - name: Decode release keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/jetconfig-release.jks
          ls -la android/app/jetconfig-release.jks

      - name: Create key.properties
        run: |
          printf '%s\n' \
            "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" \
            "keyPassword=${{ secrets.KEY_PASSWORD }}" \
            "keyAlias=${{ secrets.KEY_ALIAS }}" \
            "storeFile=jetconfig-release.jks" \
            > android/key.properties
          wc -l android/key.properties

      - name: Patch build.gradle for signing, minSdk, compileSdk 35
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          if not path.exists():
              path = Path("android/app/build.gradle.kts")
          if not path.exists():
              raise SystemExit("android/app/build.gradle not found")

          g = path.read_text(encoding="utf-8")
          print("Patching:", path)

          # Force explicit SDK numbers (Flutter 3.27 uses flutter.compileSdkVersion)
          g = re.sub(r"minSdkVersion\s+[^\n]+", "minSdkVersion 24", g)
          g = re.sub(r"minSdk\s*=\s*[^\n]+", "minSdk = 24", g)
          g = re.sub(r"compileSdkVersion\s+[^\n]+", "compileSdkVersion 35", g)
          g = re.sub(r"compileSdk\s*=\s*[^\n]+", "compileSdk = 35", g)
          g = re.sub(r"compileSdk\s+\d+", "compileSdk 35", g)
          g = re.sub(r"targetSdkVersion\s+[^\n]+", "targetSdkVersion 35", g)
          g = re.sub(r"targetSdk\s*=\s*[^\n]+", "targetSdk = 35", g)
          g = re.sub(r"targetSdk\s+\d+", "targetSdk 35", g)

          if path.suffix == ".kts":
              if "compileSdk" not in g:
                  g = re.sub(r"(android\s*\{)", r"\1\n    compileSdk = 35\n", g, count=1)
              if "keystoreProperties" not in g:
                  loader = (
                      "import java.util.Properties\n"
                      "import java.io.FileInputStream\n"
                      "val keystoreProperties = Properties()\n"
                      "val keystorePropertiesFile = rootProject.file(\"key.properties\")\n"
                      "if (keystorePropertiesFile.exists()) {\n"
                      "    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n"
                      "}\n\n"
                  )
                  g = loader + g
              if "signingConfigs" not in g:
                  block = (
                      "\n    signingConfigs {\n"
                      "        create(\"release\") {\n"
                      "            keyAlias = keystoreProperties[\"keyAlias\"] as String?\n"
                      "            keyPassword = keystoreProperties[\"keyPassword\"] as String?\n"
                      "            storeFile = (keystoreProperties[\"storeFile\"] as String?)?.let { file(it) }\n"
                      "            storePassword = keystoreProperties[\"storePassword\"] as String?\n"
                      "        }\n"
                      "    }\n"
                  )
                  g = re.sub(r"(android\s*\{)", r"\1" + block, g, count=1)
              if 'signingConfigs.getByName("release")' not in g:
                  g = re.sub(
                      r"(release\s*\{)",
                      r'\1\n            signingConfig = signingConfigs.getByName("release")\n',
                      g,
                      count=1,
                  )
          else:
              if "keystoreProperties = new Properties()" not in g:
                  loader = (
                      "\ndef keystoreProperties = new Properties()\n"
                      "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                      "if (keystorePropertiesFile.exists()) {\n"
                      "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                      "}\n"
                  )
                  m = re.search(r"plugins\s*\{[\s\S]*?\n\}", g)
                  if m:
                      g = g[: m.end()] + loader + g[m.end() :]
                  else:
                      g = loader + g
              if "signingConfigs {" not in g:
                  block = (
                      "\n    signingConfigs {\n"
                      "        release {\n"
                      "            keyAlias keystoreProperties['keyAlias']\n"
                      "            keyPassword keystoreProperties['keyPassword']\n"
                      "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
                      "            storePassword keystoreProperties['storePassword']\n"
                      "        }\n"
                      "    }\n"
                  )
                  g = re.sub(r"(android\s*\{)", r"\1" + block, g, count=1)
              g = g.replace("signingConfigs.debug", "signingConfigs.release")
              if "signingConfig signingConfigs.release" not in g:
                  g = re.sub(
                      r"(buildTypes\s*\{[\s\S]*?release\s*\{)",
                      r"\1\n            signingConfig signingConfigs.release\n",
                      g,
                      count=1,
                  )
              if "compileSdk" not in g and "compileSdkVersion" not in g:
                  g = re.sub(r"(android\s*\{)", r"\1\n    compileSdkVersion 35\n", g, count=1)

          # Ensure targetSdk exists even if Flutter template omitted it
          if "targetSdk" not in g and "targetSdkVersion" not in g:
              if path.suffix == ".kts":
                  g = re.sub(
                      r"(defaultConfig\s*\{)",
                      r"\1\n        targetSdk = 35\n",
                      g,
                      count=1,
                  )
              else:
                  g = re.sub(
                      r"(defaultConfig\s*\{)",
                      r"\1\n        targetSdkVersion 35\n",
                      g,
                      count=1,
                  )

          # Hard-overwrite any remaining flutter.targetSdkVersion references
          g = g.replace("flutter.targetSdkVersion", "35")
          g = g.replace("flutter.compileSdkVersion", "35")
          g = g.replace("flutter.minSdkVersion", "24")

          path.write_text(g, encoding="utf-8")
          text = path.read_text(encoding="utf-8")
          print("--- relevant lines ---")
          for line in text.splitlines():
              if any(k in line for k in ("compileSdk", "targetSdk", "minSdk", "signing")):
                  print(line)
          if "targetSdk" not in text and "targetSdkVersion" not in text:
              raise SystemExit("targetSdk was not written — Bazaar will reject APK")
          if not re.search(r"targetSdk(Version)?\s*=?\s*35", text):
              # last resort inject at android { level
              if path.suffix == ".kts":
                  text = re.sub(r"(android\s*\{)", r"\1\n    targetSdk = 35\n", text, count=1)
              else:
                  text = re.sub(r"(android\s*\{)", r"\1\n    targetSdkVersion 35\n", text, count=1)
              path.write_text(text, encoding="utf-8")
              print("injected targetSdk 35 at android block")
          print("patch OK")
          PY

      - name: Build release APK
        run: |
          flutter doctor -v
          flutter build apk --release --split-per-abi

      - name: Verify targetSdk >= 32 (Cafe Bazaar requirement)
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ ! -f "$APK" ]; then
            APK=$(ls build/app/outputs/flutter-apk/*-release.apk 2>/dev/null | head -1)
          fi
          echo "Checking APK: $APK"
          # try aapt / aapt2 from Android SDK
          AAPT=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name aapt2 -type f 2>/dev/null | head -1)
          if [ -z "$AAPT" ]; then
            AAPT=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name aapt -type f 2>/dev/null | head -1)
          fi
          if [ -n "$AAPT" ]; then
            echo "Using: $AAPT"
            BADGING=$("$AAPT" dump badging "$APK" 2>/dev/null || true)
            echo "$BADGING" | tr ' ' '\n' | grep -i sdk || true
            TARGET=$(echo "$BADGING" | grep -oE "targetSdkVersion:'[0-9]+'" | grep -oE "[0-9]+" | head -1)
            if [ -z "$TARGET" ]; then
              TARGET=$(echo "$BADGING" | grep -oE "targetSdkVersion:[0-9]+" | grep -oE "[0-9]+" | head -1)
            fi
            echo "Parsed targetSdkVersion=$TARGET"
            if [ -z "$TARGET" ]; then
              echo "WARNING: could not parse targetSdk from aapt; continuing"
            elif [ "$TARGET" -lt 32 ]; then
              echo "ERROR: targetSdk=$TARGET is below 32 — Cafe Bazaar will reject this APK"
              exit 1
            else
              echo "OK: targetSdk=$TARGET (>= 32)"
            fi
          else
            echo "WARNING: aapt not found; skip binary verify"
            # at least confirm gradle files still say 35
            grep -R "targetSdk" android/app/ --include="*.gradle*" || true
          fi

      - name: Prepare release artifact
        run: |
          mkdir -p release-files
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/JetConfig-VPN.apk
          else
            echo "APK not found"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi

      - name: Read app version
        id: ver
        run: |
          VER=""
          if [ -f lib/main.dart ]; then
            VER=$(grep -oP "appVersion\s*=\s*'\K[^']+" lib/main.dart | head -1 || true)
          fi
          if [ -z "$VER" ]; then
            VER="v0.0.0"
          fi
          case "$VER" in
            v*|V*) ;;
            *) VER="v$VER" ;;
          esac
          TAG="${VER}-b${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=JET VPN ${VER}" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body: |
            🚀 **JET VPN — بیلد خودکار**

            - نسخه داخل اپ: `${{ steps.ver.outputs.ver }}`
            - تگ: `${{ steps.ver.outputs.tag }}`
            - هسته: flutter_v2ray_client (Xray 26.9.9) — پشتیبانی VLESS Encryption
            - امضا با کلید ثابت
            - Actions run: `${{ github.run_number }}`

            APK: `JetConfig-VPN.apk` (arm64-v8a)
          files: release-files/JetConfig-VPN.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
