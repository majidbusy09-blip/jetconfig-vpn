name: JET VPN Test APK

on:
  push:
    branches:
      - review-hoshvareh-2.4.6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    if: ${{ github.ref == 'refs/heads/review-hoshvareh-2.4.6' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Install Android SDK 35
        run: |
          set -e
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Generate Android project if absent
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn
          fi
          test -f android/app/src/main/AndroidManifest.xml

      - name: Configure app label and Android SDK levels
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="JET VPN"', s, count=1)
          manifest.write_text(s)
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")
          s = gradle.read_text()
          s = re.sub(r'minSdkVersion\s+[^\n]+', 'minSdkVersion 24', s)
          s = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 24', s)
          s = re.sub(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 35', s)
          s = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 35', s)
          s = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', s)
          s = re.sub(r'targetSdkVersion\s+[^\n]+', 'targetSdkVersion 35', s)
          s = re.sub(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 35', s)
          s = re.sub(r'targetSdk\s+\d+', 'targetSdk 35', s)
          if gradle.suffix == ".kts":
              if 'signingConfig = signingConfigs.getByName("debug")' not in s:
                  s = re.sub(r'(release\s*\{)', r'\1\n            signingConfig = signingConfigs.getByName("debug")', s, count=1)
          else:
              if 'signingConfig signingConfigs.debug' not in s:
                  s = re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.debug', s, count=1)
          gradle.write_text(s)
          print("Gradle:", gradle)
          print("\n".join(x for x in s.splitlines() if any(k in x for k in ("minSdk", "compileSdk", "targetSdk", "signingConfig"))))
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply existing VPN notification patch
        run: bash tools/v2ray_notif_patch/apply_patch.sh

      - name: Build arm64 release-mode test APK
        run: |
          flutter doctor -v
          flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=APK_CHANNEL=arm64
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Build universal release-mode test APK
        run: |
          flutter build apk --release --dart-define=APK_CHANNEL=universal
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload test APKs (no public release)
        uses: actions/upload-artifact@v4
        with:
          name: JET-VPN-Test-APK-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
