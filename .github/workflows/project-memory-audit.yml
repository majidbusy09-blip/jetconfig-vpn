name: JET VPN - Project Memory Audit

on:
  pull_request:
    branches:
      - main
      - docs/agent-memory-foundation-20261122
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "docs/**"
      - "tools/project_memory/**"
      - ".github/workflows/project-memory-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-memory-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Verify generated code index and memory freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Resolve isolated semantic-index tooling
        working-directory: tools/project_memory/semantic
        run: dart pub get

      - name: Test Dart AST indexer
        working-directory: tools/project_memory/semantic
        run: dart test

      - name: Generate semantic AST index
        working-directory: tools/project_memory/semantic
        run: dart run bin/index.dart --write

      - name: Verify committed semantic AST index
        run: git diff --exit-code -- docs/generated/jet_vpn_semantic_index.json

      - name: Upload semantic AST index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jet-vpn-semantic-ast-index
          path: docs/generated/jet_vpn_semantic_index.json
          if-no-files-found: warn
          retention-days: 30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify lexical code index
        run: |
          set -euo pipefail
          python tools/project_memory/index_dart.py --check --check-status | tee project-memory-audit.txt
          cat project-memory-audit.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable code index
        uses: actions/upload-artifact@v4
        with:
          name: jet-vpn-code-index
          path: docs/generated/jet_vpn_code_index.json
          if-no-files-found: error
          retention-days: 30
