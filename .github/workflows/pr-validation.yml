name: JET VPN - Non-production PR Validation

on:
  push:
    branches:
      - integration/memory-and-recovery-20261122
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "tools/v2ray_notif_patch/**"
      - ".github/workflows/pr-validation.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jet-vpn-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android scaffold in the temporary CI workspace
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name=jetconfig_vpn --org com.jetconfig.vpn
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          # flutter create may generate a placeholder widget test that does not
          # match this app entrypoint. Remove only that exact scaffold file.
          if [ -f test/widget_test.dart ] && grep -q "package:jetconfig_vpn/main.dart" test/widget_test.dart; then
            rm -f test/widget_test.dart
            rmdir test 2>/dev/null || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Apply repository-maintained V2Ray patches to CI cache
        run: bash tools/v2ray_notif_patch/apply_patch.sh

      - name: Static analysis
        run: flutter analyze lib test --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run application tests
        run: flutter test --no-pub

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JET-VPN-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
