name: Build JetConfig VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Auto Migrate to V2 Embedding and Configure Icons
        run: |
          python3 -m pip install pillow
          python3 -c "
          import urllib.request, os, shutil, re
          from PIL import Image

          # ۱. تولید آیکون‌های اختصاصی از لوگوی کانال
          try:
              urllib.request.urlretrieve('https://majid6064.ir/logo.png', 'logo.png')
              im = Image.open('logo.png').convert('RGBA')

              anydpi_path = 'android/app/src/main/res/mipmap-anydpi-v26'
              if os.path.exists(anydpi_path):
                  shutil.rmtree(anydpi_path)

              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              for folder, size in sizes.items():
                  path = f'android/app/src/main/res/{folder}'
                  os.makedirs(path, exist_ok=True)
                  im.resize((size, size), Image.Resampling.LANCZOS).save(f'{path}/ic_launcher.png', 'PNG')
              print('Icons created successfully.')
          except Exception as e:
              print('Icon generation skipped:', e)

          # ۲. ارتقای AndroidManifest.xml به V2 Embedding
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  m_content = f.read()

              # تغییر نام برنامه
              m_content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"JetConfig VPN\"', m_content, count=1)

              # اضافه کردن تگ الزامی V2 Embedding
              v2_tag = '<meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />'
              if 'android:name=\"flutterEmbedding\"' not in m_content:
                  m_content = m_content.replace('</application>', f'    {v2_tag}\n    </application>')

              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(m_content)
              print('AndroidManifest.xml upgraded to V2.')

          # ۳. ارتقای کدهای MainActivity به V2
          for root, _, files in os.walk('android/app/src/main'):
              for file in files:
                  if file in ['MainActivity.java', 'MainActivity.kt']:
                      f_path = os.path.join(root, file)
                      with open(f_path, 'r', encoding='utf-8') as f:
                          c = f.read()
                      c = c.replace('io.flutter.app.FlutterActivity', 'io.flutter.embedding.android.FlutterActivity')
                      with open(f_path, 'w', encoding='utf-8') as f:
                          f.write(c)
                      print(f'{file} upgraded to V2.')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetConfig-VPN-Release
          path: build/app/outputs/flutter-apk/app-release.apk
